<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ATLAS — Physical sensor map</title>
  <meta name="description" content="Live weather, air, tide and earthquake map over GAIA physical oracles." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/atlas.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>ATLAS</h1>
          <p class="tag">Physical sensor mesh · GAIA live relays</p>
        </div>
      </div>
      <div class="hud" id="hud">
        <span class="pill" id="status-pill">boot</span>
        <span class="stat" id="stat-stations">—</span>
        <span class="stat" id="stat-quakes">—</span>
        <span class="stat" id="stat-age">—</span>
      </div>
    </header>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <h2>Layers</h2>
        <button type="button" class="ghost" id="btn-refresh" title="Refresh viewport">↻</button>
      </div>
      <div class="layers" id="layers"></div>
      <div class="panel-head sub">
        <h2>In view</h2>
        <span class="hint" id="viewport-hint">move map to load</span>
      </div>
      <div class="station-list" id="station-list"></div>
      <footer class="panel-foot">
        <a href="https://iot.modelmarket.dev" target="_blank" rel="noopener">GAIA gateway</a>
        <a href="https://magic-ai-factory.com/monitor/" target="_blank" rel="noopener">Alien Monitor</a>
      </footer>
    </aside>

    <aside class="detail" id="detail" hidden>
      <div class="detail-head">
        <button type="button" class="ghost" id="detail-close" aria-label="Close">✕</button>
        <div>
          <h2 id="detail-title">Sensor</h2>
          <p class="detail-sub" id="detail-sub"></p>
        </div>
      </div>
      <p class="detail-status" id="detail-status"></p>
      <p class="detail-summary" id="detail-summary"></p>
      <div class="detail-metrics" id="detail-metrics"></div>
      <div class="detail-meta" id="detail-meta"></div>
    </aside>

    <main id="map" role="application" aria-label="ATLAS sensor map"></main>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/assets/map-lib.js"></script>
  <script src="/assets/atlas.js"></script>
  <script src="/assets/assistant.js"></script>
  <script>
    const mapApi = AtlasMap.mount({ mode: "full", root: document.getElementById("app") });
    AtlasAI.mount({
      getBbox: () => {
        if (!mapApi || !mapApi.map) return null;
        const b = mapApi.map.getBounds();
        return { west: b.getWest(), south: b.getSouth(), east: b.getEast(), north: b.getNorth() };
      },
      getStationIds: () => {
        try {
          const list = mapApi.visibleStations && mapApi.visibleStations();
          return list && list.length ? list.map((s) => s.id) : null;
        } catch (_) {
          return null;
        }
      },
      getLocale: () => (navigator.language || "en").slice(0, 2),
    });
  </script>
</body>
</html>

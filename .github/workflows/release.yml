name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip build twine
          bash scripts/sync_package_assets.sh
          pip install -e ".[dev]"
          pytest -q --tb=short --maxfail=5

      - name: Build wheel and sdist
        run: |
          bash scripts/sync_package_assets.sh
          rm -rf dist build
          python -m build
          twine check --strict dist/*

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag must look like v1.2.3"; exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ATLAS ${{ steps.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            Physical sensor map over GAIA live relays + ATLAS Analyst.

            ```bash
            pip install aimarket-atlas==${{ steps.meta.outputs.tag }}
            atlas --host 127.0.0.1 --port 9330
            ```

            - Live: https://atlas.modelmarket.dev/
            - Landing: https://alexar76.github.io/atlas/
            - PyPI: https://pypi.org/project/aimarket-atlas/
            - Guide: docs/GUIDE.md

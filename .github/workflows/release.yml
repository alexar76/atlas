name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip build twine
          bash scripts/sync_package_assets.sh
          pip install -e ".[dev]"
          pytest -q --tb=short --maxfail=5

      - name: Build wheel and sdist
        run: |
          bash scripts/sync_package_assets.sh
          rm -rf dist build
          python -m build
          twine check --strict dist/*

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ATLAS ${{ steps.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            Physical sensor map over GAIA live relays + ATLAS Analyst.

            ```bash
            pip install aimarket-atlas==${{ steps.meta.outputs.tag }}
            atlas --host 127.0.0.1 --port 9330
            ```

            - Live: https://atlas.modelmarket.dev/
            - Landing: https://alexar76.github.io/atlas/
            - PyPI: https://pypi.org/project/aimarket-atlas/
            - Guide: docs/GUIDE.md

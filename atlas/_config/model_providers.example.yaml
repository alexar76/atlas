# ATLAS LLM providers — same ids as AI-Factory / Alien Monitor.
# Runtime merges this with monorepo data/config/model_providers.yaml when present.
# Keys come from the environment (never commit secrets).
#
# Types:
#   openai_compatible — DeepSeek, Groq, Together, LM Studio (:1234/v1), …
#   anthropic         — Claude Messages API
#   local_ollama      — native Ollama /api/chat (or …/v1 chat/completions)
default_provider: deepseek_api
providers:
  deepseek_api:
    api_key: null
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    enabled: true
    models:
      heavy: deepseek-v4-pro
      light: deepseek-v4-flash
    provider_type: openai_compatible
    capabilities:
      max_tokens: 4096
      context_window: 1000000
      supports_streaming: true

  anthropic_cloud:
    api_key: null
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1
    enabled: true
    models:
      heavy: claude-3-5-sonnet-latest
      light: claude-3-5-haiku-latest
    provider_type: anthropic
    capabilities:
      max_tokens: 4096
      context_window: 200000

  groq_api:
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    enabled: true
    models:
      heavy: llama3-70b-8192
      light: llama3-8b-8192
    provider_type: openai_compatible
    capabilities:
      max_tokens: 4096

  together_ai:
    api_key_env: TOGETHER_API_KEY
    base_url: https://api.together.xyz/v1
    enabled: true
    models:
      heavy: meta-llama/Llama-3.1-70B-Instruct-Turbo
      light: mistralai/Mixtral-8x7B-Instruct-v0.1
    provider_type: openai_compatible
    capabilities:
      max_tokens: 4096

  # Local OpenAI-compatible (LM Studio / llama.cpp server). No API key.
  # In Docker use host.docker.internal; on bare metal often 127.0.0.1:1234/v1
  lm_studio:
    api_key_env: null
    base_url: http://host.docker.internal:1234/v1
    enabled: true
    models:
      heavy: local-model
      light: local-model
    provider_type: openai_compatible
    capabilities:
      max_tokens: 4096

  # Native Ollama chat. Override ATLAS_OLLAMA_URL / models via env if needed.
  local_ollama:
    api_key_env: null
    base_url: http://host.docker.internal:11434
    enabled: true
    models:
      heavy: qwen2.5:14b
      light: qwen2.5:7b
    provider_type: local_ollama
    capabilities:
      max_tokens: 4096

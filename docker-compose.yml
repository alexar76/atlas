# ATLAS — physical sensor map over GAIA live relays.
# Build from monorepo root:
#   docker compose -f atlas/docker-compose.yml up -d --build
#
# Loopback bind only — publish via nginx TLS edge (see deploy/nginx/atlas.modelmarket.dev.conf).

services:
  atlas:
    build:
      context: ..
      dockerfile: atlas/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      ATLAS_PORT: "9330"
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-https://atlas.modelmarket.dev}
      ATLAS_GAIA_URL: ${ATLAS_GAIA_URL:-https://iot.modelmarket.dev}
      ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-https://atlas.modelmarket.dev,https://magic-ai-factory.com,https://iot.modelmarket.dev}
      ATLAS_POLL_INTERVAL_S: ${ATLAS_POLL_INTERVAL_S:-30}
      ATLAS_RATE_LIMIT_PER_MIN: ${ATLAS_RATE_LIMIT_PER_MIN:-180}
      ATLAS_GAIA_CONCURRENCY: ${ATLAS_GAIA_CONCURRENCY:-4}
      ATLAS_GAIA_TIMEOUT_S: ${ATLAS_GAIA_TIMEOUT_S:-180}
      ATLAS_GAIA_REQUESTS_PER_MINUTE: ${ATLAS_GAIA_REQUESTS_PER_MINUTE:-72}
      ATLAS_READING_TTL_S: ${ATLAS_READING_TTL_S:-300}
      ATLAS_SIGNING_KEY_PATH: ${ATLAS_SIGNING_KEY_PATH:-/data/atlas_signing_key}
      ATLAS_SIGNING_SEED_B64: ${ATLAS_SIGNING_SEED_B64:-}
      # Charge for the capabilities the manifest already prices. Before this, every priced
      # invoke was served for free — a price list nobody was asked to honour. Enforcement
      # changes what existing callers get back, so it stays an explicit operator decision;
      # the default here is on because production has it on, and a compose file that
      # disagreed with production would be worse than one that states the choice.
      ATLAS_PAYMENT_ENFORCED: ${ATLAS_PAYMENT_ENFORCED:-1}
      # The free allowance every caller gets before the 402, mirroring the hub's own trial
      # terms so an agent that discovers either service sees the same deal.
      ATLAS_TRIAL_WINDOW: ${ATLAS_TRIAL_WINDOW:-hourly}
      ATLAS_TRIAL_MAX_PER_CALLER: ${ATLAS_TRIAL_MAX_PER_CALLER:-5}
      # On the mounted volume, like the signing key and the watchbox log: a ledger that a
      # `up -d --build` wipes hands every caller a fresh free tier on every redeploy.
      ATLAS_TRIAL_DB_PATH: ${ATLAS_TRIAL_DB_PATH:-/data/atlas_trials.db}
      ATLAS_TRIAL_POLICY_PATH: ${ATLAS_TRIAL_POLICY_PATH:-/data/atlas_trial_policy.json}
      # Watchbox monitoring evidence. MUST live on the mounted volume: the log is the
      # product ("prove you were monitoring"), and a log that a `up -d --build` wipes is
      # not evidence. atlas/data/ resolves INSIDE the image, so never default there.
      # Master key over the watchbox registry AND every tenant's monitoring-evidence
      # log. The registry was anonymous in production — anyone could list every watchbox
      # and DELETE one, which also made its log answer 404. Empty here means
      # `_operator_ok` refuses EVERYONE, so this must be set before deploying or the
      # feature locks itself out (buyers use their per-watchbox owner token instead,
      # minted at creation; this one is the operator's).
      ATLAS_OPERATOR_TOKEN: ${ATLAS_OPERATOR_TOKEN:-}
      # Self-serve watchbox creation. Off = only the operator may create a box and hand
      # the owner token to the buyer. On = anyone may create one and is given its owner
      # token; bounded because every box costs a check per interval and an outbound POST.
      ATLAS_WATCHBOX_OPEN_SIGNUP: ${ATLAS_WATCHBOX_OPEN_SIGNUP:-0}
      ATLAS_WATCHBOX_SELF_SERVE_MAX: ${ATLAS_WATCHBOX_SELF_SERVE_MAX:-200}
      ATLAS_MONITOR_DB_PATH: ${ATLAS_MONITOR_DB_PATH:-/data/atlas_monitor.db}
      ATLAS_MONITOR_RETENTION_DAYS: ${ATLAS_MONITOR_RETENTION_DAYS:-1095}
      ATLAS_WATCHBOX_DELIVERY: ${ATLAS_WATCHBOX_DELIVERY:-1}
      ATLAS_WATCHBOX_INTERVAL_S: ${ATLAS_WATCHBOX_INTERVAL_S:-300}
      # The watchbox registry itself was JSON inside the image too — same volume, same
      # reason: a subscription that vanishes on redeploy cannot be monitored against.
      ATLAS_WATCHBOX_PATH: ${ATLAS_WATCHBOX_PATH:-/data/watchboxes.json}
      ATLAS_FIRMS_HOTSPOT_LIMIT: ${ATLAS_FIRMS_HOTSPOT_LIMIT:-250000}
      ATLAS_FIRMS_MAP_PIN_LIMIT: ${ATLAS_FIRMS_MAP_PIN_LIMIT:-2000}
      # Production LLM — DeepSeek (deepseek-v4-pro). Key from host .env / secrets.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      ATLAS_LLM_PROVIDER: ${ATLAS_LLM_PROVIDER:-deepseek_api}
      ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-deepseek-v4-pro}
      ATLAS_LLM_MODEL_LIGHT: ${ATLAS_LLM_MODEL_LIGHT:-deepseek-v4-flash}
      ATLAS_LLM_BASE_URL: ${ATLAS_LLM_BASE_URL:-https://api.deepseek.com/v1}
      ATLAS_LLM_CONFIG: ${ATLAS_LLM_CONFIG:-/app/config/model_providers.yaml}
      ATLAS_OLLAMA_URL: ${ATLAS_OLLAMA_URL:-http://host.docker.internal:11434}
      ATLAS_LM_STUDIO_URL: ${ATLAS_LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9330:9330"
    volumes:
      - atlas_data:/data
    restart: unless-stopped
    networks:
      - default
      - ecosystem
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9330/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  atlas_data:

networks:
  ecosystem:
    external: true
